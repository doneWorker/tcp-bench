apiVersion: batch/v1
kind: Job
metadata: { name: client-std }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: echo-client:v1
          imagePullPolicy: IfNotPresent
          args: ["-addr", "std:8080", "-c", "10000", "-n", "5000000"]
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits:   { cpu: "2", memory: 1Gi }
---
apiVersion: batch/v1
kind: Job
metadata: { name: client-gnet }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: echo-client:v1
          imagePullPolicy: IfNotPresent
          args: ["-addr", "gnet:8081", "-c", "10000", "-n", "5000000"]
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits:   { cpu: "2", memory: 1Gi }